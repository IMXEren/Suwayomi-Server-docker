name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

# Pull requests build and smoke-test the image without publishing anything.

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve input JAR
        id: input
        run: |
          set -euo pipefail
          json="$(curl -fsSL 'https://api.github.com/repos/IMXEren/Suwayomi-Server/releases?per_page=20')"
          url="$(echo "$json" | jq -r '[.[] | .assets[] | select(.name | endswith(".jar"))][0].browser_download_url')"
          tag="$(echo "$json" | jq -r '[.[] | select(any(.assets[]; .name | endswith(".jar")))][0].tag_name')"
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "no JAR asset found in recent releases of IMXEren/Suwayomi-Server" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          load: true
          build-args: |
            BUILD_DATE=${{ github.run_started_at }}
            TACHIDESK_RELEASE_TAG=${{ steps.input.outputs.tag }}
            TACHIDESK_RELEASE_DOWNLOAD_URL=${{ steps.input.outputs.url }}
            TACHIDESK_FILENAME=server.jar
            TACHIDESK_KCEF=n
          tags: suwayomi-ci:testing

      - name: Smoke test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tachidesk"
          chmod -R 777 "$RUNNER_TEMP/tachidesk"
          docker run -d -p 127.0.0.1:4568:4567 \
            -v "$RUNNER_TEMP/tachidesk:/home/suwayomi/.local/share/Tachidesk" \
            --name suwayomi_ci suwayomi-ci:testing
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4568/api/v1/settings/about/ | grep -q "Suwayomi-Server"; then
              ok=1
              break
            fi
            sleep 3
          done
          docker logs suwayomi_ci || true
          docker rm -f suwayomi_ci
          test "${ok}" = "1"
